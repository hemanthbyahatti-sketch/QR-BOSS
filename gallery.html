<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shared Media Gallery - Pro QR Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background:
        radial-gradient(ellipse 85% 55% at 50% -15%, rgba(139, 92, 246, 0.25), transparent 60%),
        radial-gradient(circle at 10% 25%, rgba(255, 0, 122, 0.22), transparent 42%),
        radial-gradient(circle at 90% 35%, rgba(255, 85, 0, 0.18), transparent 45%),
        radial-gradient(circle at 50% 88%, rgba(255, 0, 122, 0.14), transparent 50%),
        #090b12;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 40px 20px;
    }
    .gallery-shell {
      width: min(1160px, 100%);
      background: rgba(18, 22, 34, 0.82);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 28px;
      padding: 38px 32px;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.18);
    }
    .gallery-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 28px;
      padding-bottom: 22px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .brand-title {
      margin: 0;
      font-size: clamp(1.8rem, 3.5vw, 2.6rem);
      font-weight: 900;
      letter-spacing: -0.8px;
      background: linear-gradient(135deg, #ff007a 0%, #ff5500 50%, #ffbe0b 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 10px 30px rgba(255, 0, 122, 0.35);
    }
    .subtitle {
      margin: 4px 0 0 0;
      font-size: 0.95rem;
      color: #94a3b8;
      font-weight: 600;
    }
    .btn-home {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, #ff007a 0%, #ff5500 100%);
      color: #ffffff;
      padding: 12px 22px;
      border-radius: 14px;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.92rem;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 8px 24px rgba(255, 0, 122, 0.4);
      transition: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .btn-home:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(255, 0, 122, 0.6);
      color: #ffffff;
    }
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 22px;
    }
    .media-card {
      background: rgba(11, 14, 24, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
      transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .media-card:hover {
      transform: translateY(-5px);
      border-color: rgba(255, 0, 122, 0.45);
      box-shadow: 0 20px 45px rgba(255, 0, 122, 0.25);
    }
    .media-container {
      width: 100%;
      height: 240px;
      background: #08090d;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .media-card img,
    .media-card video {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      background: #08090d;
    }
    .media-card .card-info {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .media-card .label {
      font-size: 0.95rem;
      font-weight: 700;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .media-card .meta-pill {
      align-self: flex-start;
      font-size: 0.72rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(255, 0, 122, 0.15);
      color: #ff3b8d;
      border: 1px solid rgba(255, 0, 122, 0.3);
    }
    .media-card .meta-pill.video {
      background: rgba(121, 40, 202, 0.2);
      color: #b366ff;
      border-color: rgba(121, 40, 202, 0.4);
    }
    .empty {
      grid-column: 1 / -1;
      text-align: center;
      color: #94a3b8;
      font-size: 1.1rem;
      font-weight: 600;
      padding: 60px 20px;
      background: rgba(255, 255, 255, 0.02);
      border: 2px dashed rgba(255, 255, 255, 0.1);
      border-radius: 20px;
    }
  </style>
</head>
<body>
  <div class="gallery-shell">
    <div class="gallery-header">
      <div>
        <h1 class="brand-title">Shared Media Gallery</h1>
        <div class="subtitle">Uploaded via Pro QR Studio Live Server</div>
      </div>
      <a href="/" class="btn-home">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
        Generate QR
      </a>
    </div>
    <div class="gallery-grid" id="gallery-grid">
      <div class="empty">Loading media contents...</div>
    </div>
  </div>

  <script src="media-config.js"></script>
  <script>
    const path = window.location.pathname;
    const match = path.match(/\/gallery\/(.+)$/);
    const galleryId = (match ? match[1].replace(/\/$/, '') : null) || new URLSearchParams(window.location.search).get('id');
    const filesParam = new URLSearchParams(window.location.search).get('files');

    function renderFiles(files, apiBase = '') {
      const galleryGrid = document.getElementById('gallery-grid');
      galleryGrid.innerHTML = '';
      files.forEach(file => {
        const item = document.createElement('div');
        item.className = 'media-card';
        const rawPath = file.path || file.url || '';
        const fileSrc = rawPath.startsWith('http') ? rawPath : `${apiBase}${rawPath}`;

        const mediaContainer = document.createElement('div');
        mediaContainer.className = 'media-container';

        if (file.type === 'video') {
          const video = document.createElement('video');
          video.src = fileSrc;
          video.controls = true;
          video.muted = true;
          video.preload = 'metadata';
          mediaContainer.appendChild(video);
        } else {
          const img = document.createElement('img');
          img.src = fileSrc;
          img.alt = file.name || 'Shared Media';
          mediaContainer.appendChild(img);
        }
        item.appendChild(mediaContainer);

        const cardInfo = document.createElement('div');
        cardInfo.className = 'card-info';

        const pill = document.createElement('span');
        pill.className = `meta-pill ${file.type === 'video' ? 'video' : 'image'}`;
        pill.textContent = file.type === 'video' ? 'Video File' : 'Image File';
        cardInfo.appendChild(pill);

        const label = document.createElement('div');
        label.className = 'label';
        label.textContent = file.name || 'Media Item';
        label.title = file.name || 'Media Item';
        cardInfo.appendChild(label);

        item.appendChild(cardInfo);
        galleryGrid.appendChild(item);
      });
    }

    async function loadGallery() {
      const galleryGrid = document.getElementById('gallery-grid');

      // 1. Direct files payload in query
      if (filesParam) {
        try {
          const parsed = JSON.parse(decodeURIComponent(filesParam));
          if (Array.isArray(parsed) && parsed.length > 0) {
            renderFiles(parsed, '');
            return;
          }
        } catch (e) {
          console.warn('Could not parse files parameter', e);
        }
      }

      // 2. Fetch from backend API
      if (!galleryId) {
        galleryGrid.innerHTML = '<div class="empty">No media files specified for this gallery.</div>';
        return;
      }

      try {
        const apiBase = (typeof window !== 'undefined' && window.MEDIA_API_BASE && window.MEDIA_API_BASE !== 'null')
          ? String(window.MEDIA_API_BASE).replace(/\/$/, '')
          : '';
        const response = await fetch(`${apiBase}/api/gallery/${encodeURIComponent(galleryId)}`);
        const data = await response.json();
        if (!response.ok || !data.files || !data.files.length) {
          galleryGrid.innerHTML = '<div class="empty">No media files found in this gallery yet.</div>';
          return;
        }

        renderFiles(data.files, apiBase);
      } catch (error) {
        galleryGrid.innerHTML = '<div class="empty">No media files available in this gallery.</div>';
      }
    }

    loadGallery();
  </script>
</body>
</html>

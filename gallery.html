<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shared Media Gallery - Pro QR Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background:
        radial-gradient(ellipse 85% 55% at 50% -15%, rgba(139, 92, 246, 0.25), transparent 60%),
        radial-gradient(circle at 10% 25%, rgba(255, 0, 122, 0.22), transparent 42%),
        radial-gradient(circle at 90% 35%, rgba(255, 85, 0, 0.18), transparent 45%),
        radial-gradient(circle at 50% 88%, rgba(255, 0, 122, 0.14), transparent 50%),
        #090b12;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 40px 20px;
    }
    .gallery-shell {
      width: min(1160px, 100%);
      background: rgba(18, 22, 34, 0.82);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 28px;
      padding: 38px 32px;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.18);
    }
    .gallery-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 24px;
      padding-bottom: 22px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .brand-title {
      margin: 0;
      font-size: clamp(1.8rem, 3.5vw, 2.6rem);
      font-weight: 900;
      letter-spacing: -0.8px;
      background: linear-gradient(135deg, #ff007a 0%, #ff5500 50%, #ffbe0b 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 10px 30px rgba(255, 0, 122, 0.35);
    }
    .subtitle {
      margin: 4px 0 0 0;
      font-size: 0.95rem;
      color: #94a3b8;
      font-weight: 600;
    }
    .gallery-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 14px;
      margin-bottom: 24px;
    }
    .filter-pills {
      display: inline-flex;
      background: rgba(11, 14, 24, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 999px;
      padding: 4px;
      gap: 4px;
    }
    .filter-pill {
      background: transparent;
      border: none;
      color: #94a3b8;
      padding: 6px 16px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .filter-pill.active {
      background: linear-gradient(135deg, #ff007a, #ff5500);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(255, 0, 122, 0.4);
    }
    .items-count-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 16px;
      border-radius: 999px;
      background: rgba(0, 245, 155, 0.14);
      border: 1px solid rgba(0, 245, 155, 0.35);
      color: #00f59b;
      font-size: 0.82rem;
      font-weight: 800;
    }
    .btn-home {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, #ff007a 0%, #ff5500 100%);
      color: #ffffff;
      padding: 12px 22px;
      border-radius: 14px;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.92rem;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 8px 24px rgba(255, 0, 122, 0.4);
      transition: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .btn-home:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(255, 0, 122, 0.6);
      color: #ffffff;
    }
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 22px;
    }
    .media-card {
      background: rgba(11, 14, 24, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
      transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
      position: relative;
    }
    .media-card:hover {
      transform: translateY(-5px);
      border-color: rgba(255, 0, 122, 0.45);
      box-shadow: 0 20px 45px rgba(255, 0, 122, 0.25);
    }
    .media-container {
      width: 100%;
      height: 240px;
      background: #141724;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      cursor: pointer;
    }
    .media-card img,
    .media-card video {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      background: #141724;
      transition: transform 0.4s ease;
    }
    .media-card:hover img {
      transform: scale(1.05);
    }
    .media-fallback {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
      color: #94a3b8;
    }
    .media-fallback-icon {
      font-size: 2.4rem;
      margin-bottom: 8px;
    }
    .media-fallback-name {
      font-size: 0.88rem;
      font-weight: 700;
      color: #f1f5f9;
      word-break: break-all;
    }
    .media-fallback-hint {
      font-size: 0.75rem;
      color: #00f59b;
      margin-top: 6px;
      font-weight: 600;
    }
    .media-overlay-zoom {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.25s ease;
      color: #ffffff;
      font-weight: 700;
      font-size: 0.9rem;
      gap: 6px;
    }
    .media-container:hover .media-overlay-zoom {
      opacity: 1;
    }
    .media-card .card-info {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .media-card .label {
      font-size: 0.95rem;
      font-weight: 700;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card-meta-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .media-card .meta-pill {
      font-size: 0.72rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(255, 0, 122, 0.15);
      color: #ff3b8d;
      border: 1px solid rgba(255, 0, 122, 0.3);
    }
    .media-card .meta-pill.video {
      background: rgba(121, 40, 202, 0.2);
      color: #b366ff;
      border-color: rgba(121, 40, 202, 0.4);
    }
    .card-num-badge {
      font-size: 0.75rem;
      font-weight: 800;
      color: #94a3b8;
    }
    .empty {
      grid-column: 1 / -1;
      text-align: center;
      color: #94a3b8;
      font-size: 1.1rem;
      font-weight: 600;
      padding: 60px 20px;
      background: rgba(255, 255, 255, 0.02);
      border: 2px dashed rgba(255, 255, 255, 0.1);
      border-radius: 20px;
    }

    /* Lightbox Modal */
    .lightbox-modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.92);
      backdrop-filter: blur(16px);
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .lightbox-modal.active {
      display: flex;
      animation: fadeIn 0.25s ease;
    }
    .lightbox-content {
      max-width: 90vw;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }
    .lightbox-content img,
    .lightbox-content video {
      max-width: 88vw;
      max-height: 75vh;
      border-radius: 16px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.2);
      object-fit: contain;
    }
    .lightbox-nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #ffffff;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      transition: all 0.2s ease;
    }
    .lightbox-nav-btn:hover {
      background: #ff007a;
      transform: translateY(-50%) scale(1.1);
    }
    .lightbox-prev { left: -60px; }
    .lightbox-next { right: -60px; }
    .lightbox-close {
      position: absolute;
      top: -45px;
      right: 0;
      background: rgba(255, 255, 255, 0.15);
      border: none;
      color: #ffffff;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .lightbox-close:hover {
      background: #ff3366;
    }
    .lightbox-caption {
      margin-top: 14px;
      font-size: 0.95rem;
      font-weight: 700;
      color: #cbd5e1;
      text-align: center;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.96); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>
  <div class="gallery-shell">
    <div class="gallery-header">
      <div>
        <h1 class="brand-title" id="gallery-title">Shared Media Gallery</h1>
        <div class="subtitle" id="gallery-subtitle">Bundle of photos and videos created with QR BOSS Studio</div>
      </div>
      <a href="/" class="btn-home">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
        Generate QR
      </a>
    </div>

    <!-- Gallery Toolbar: Filters & Counter -->
    <div class="gallery-toolbar">
      <div class="filter-pills" id="filter-pills">
        <button class="filter-pill active" data-filter="all">All (<span id="count-all">0</span>)</button>
        <button class="filter-pill" data-filter="image">Photos (<span id="count-photos">0</span>)</button>
        <button class="filter-pill" data-filter="video">Videos (<span id="count-videos">0</span>)</button>
      </div>
      <div class="items-count-badge" id="items-count-badge">
        <span id="items-badge-text">Loading items...</span>
      </div>
    </div>

    <!-- Media Cards Grid -->
    <div class="gallery-grid" id="gallery-grid">
      <div class="empty">Loading media contents...</div>
    </div>
  </div>

  <!-- Fullscreen Lightbox Modal -->
  <div class="lightbox-modal" id="lightbox-modal">
    <div class="lightbox-content">
      <button class="lightbox-close" id="lightbox-close">&times;</button>
      <button class="lightbox-nav-btn lightbox-prev" id="lightbox-prev">&#10094;</button>
      <div id="lightbox-media-slot"></div>
      <button class="lightbox-nav-btn lightbox-next" id="lightbox-next">&#10095;</button>
      <div class="lightbox-caption" id="lightbox-caption"></div>
    </div>
  </div>

  <script src="media-config.js"></script>
  <script>
    let allGalleryFiles = [];
    let currentActiveFilter = 'all';
    let activeLightboxIndex = 0;

    const path = window.location.pathname;
    const match = path.match(/\/gallery\/(.+)$/);
    const galleryId = (match ? match[1].replace(/\/$/, '') : null) || new URLSearchParams(window.location.search).get('id');
    const filesParam = new URLSearchParams(window.location.search).get('files');
    const gParam = new URLSearchParams(window.location.search).get('g');

    function renderFiles(files, apiBase = '') {
      allGalleryFiles = files.map((f, i) => ({
        ...f,
        index: i + 1,
        fullSrc: (f.path || f.url || '').startsWith('http') ? (f.path || f.url) : `${apiBase}${f.path || f.url}`
      }));

      // Update counters
      const photosCount = allGalleryFiles.filter(f => f.type !== 'video').length;
      const videosCount = allGalleryFiles.filter(f => f.type === 'video').length;
      document.getElementById('count-all').textContent = allGalleryFiles.length;
      document.getElementById('count-photos').textContent = photosCount;
      document.getElementById('count-videos').textContent = videosCount;
      document.getElementById('items-badge-text').textContent = `${allGalleryFiles.length} Media Items Available`;
      document.getElementById('gallery-title').textContent = `Shared Media Gallery (${allGalleryFiles.length} Items)`;

      applyFilter(currentActiveFilter);
    }

    function applyFilter(filter) {
      currentActiveFilter = filter;
      document.querySelectorAll('.filter-pill').forEach(btn => {
        btn.classList.toggle('active', btn.getAttribute('data-filter') === filter);
      });

      const filtered = filter === 'all' 
        ? allGalleryFiles 
        : allGalleryFiles.filter(f => (filter === 'video' ? f.type === 'video' : f.type !== 'video'));

      const galleryGrid = document.getElementById('gallery-grid');
      galleryGrid.innerHTML = '';

      if (!filtered.length) {
        galleryGrid.innerHTML = '<div class="empty">No media matches this filter.</div>';
        return;
      }

      filtered.forEach((file, index) => {
        const item = document.createElement('div');
        item.className = 'media-card';

        const mediaContainer = document.createElement('div');
        mediaContainer.className = 'media-container';
        mediaContainer.addEventListener('click', () => openLightbox(file.index - 1));

        if (file.type === 'video') {
          const video = document.createElement('video');
          video.src = file.fullSrc;
          video.controls = true;
          video.muted = true;
          video.playsInline = true;
          video.setAttribute('playsinline', '');
          video.setAttribute('webkit-playsinline', '');
          video.preload = 'metadata';
          video.addEventListener('click', (e) => {
            e.stopPropagation();
          });
          video.onerror = () => {
            video.style.display = 'none';
            const fallback = document.createElement('div');
            fallback.className = 'media-fallback';
            fallback.innerHTML = `
              <div class="media-fallback-icon">🎬</div>
              <div class="media-fallback-name">${file.name || 'Video'}</div>
              <div class="media-fallback-hint">Tap to play in full player</div>
            `;
            mediaContainer.appendChild(fallback);
          };
          mediaContainer.appendChild(video);
        } else {
          const img = document.createElement('img');
          img.alt = file.name || `Photo #${file.index}`;
          img.loading = 'lazy';
          img.onerror = () => {
            img.style.display = 'none';
            const fallback = document.createElement('div');
            fallback.className = 'media-fallback';
            fallback.innerHTML = `
              <div class="media-fallback-icon">🖼️</div>
              <div class="media-fallback-name">${file.name || 'Photo'}</div>
              <div class="media-fallback-hint">Tap to view full resolution</div>
            `;
            mediaContainer.appendChild(fallback);
          };
          img.src = file.fullSrc;
          mediaContainer.appendChild(img);
        }

        const zoomOverlay = document.createElement('div');
        zoomOverlay.className = 'media-overlay-zoom';
        zoomOverlay.innerHTML = '<span>🔍 Click to View</span>';
        mediaContainer.appendChild(zoomOverlay);

        item.appendChild(mediaContainer);

        const cardInfo = document.createElement('div');
        cardInfo.className = 'card-info';

        const metaRow = document.createElement('div');
        metaRow.className = 'card-meta-row';

        const pill = document.createElement('span');
        pill.className = `meta-pill ${file.type === 'video' ? 'video' : 'image'}`;
        pill.textContent = file.type === 'video' ? 'Video' : 'Photo';
        metaRow.appendChild(pill);

        const numBadge = document.createElement('span');
        numBadge.className = 'card-num-badge';
        numBadge.textContent = `#${file.index}`;
        metaRow.appendChild(numBadge);

        cardInfo.appendChild(metaRow);

        const label = document.createElement('div');
        label.className = 'label';
        label.textContent = file.name || `Item ${file.index}`;
        label.title = file.name || `Item ${file.index}`;
        cardInfo.appendChild(label);

        item.appendChild(cardInfo);
        galleryGrid.appendChild(item);
      });
    }

    // Lightbox modal logic
    function openLightbox(index) {
      if (index < 0 || index >= allGalleryFiles.length) return;
      activeLightboxIndex = index;
      const modal = document.getElementById('lightbox-modal');
      const slot = document.getElementById('lightbox-media-slot');
      const caption = document.getElementById('lightbox-caption');
      const file = allGalleryFiles[index];

      slot.innerHTML = '';
      if (file.type === 'video') {
        const vid = document.createElement('video');
        vid.src = file.fullSrc;
        vid.controls = true;
        vid.autoplay = true;
        vid.playsInline = true;
        vid.setAttribute('playsinline', '');
        vid.setAttribute('webkit-playsinline', '');
        slot.appendChild(vid);
      } else {
        const img = document.createElement('img');
        img.src = file.fullSrc;
        img.alt = file.name;
        img.onerror = () => {
          slot.innerHTML = `
            <div class="media-fallback" style="padding: 40px;">
              <div class="media-fallback-icon">🖼️</div>
              <div class="media-fallback-name">${file.name || 'Photo'}</div>
              <div class="media-fallback-hint"><a href="${file.fullSrc}" target="_blank" style="color:#00f59b;text-decoration:underline;">Tap here to open original photo</a></div>
            </div>
          `;
        };
        slot.appendChild(img);
      }

      caption.textContent = `${file.name || 'Media Item'} (${index + 1} of ${allGalleryFiles.length})`;
      modal.classList.add('active');
    }

    function closeLightbox() {
      const modal = document.getElementById('lightbox-modal');
      const slot = document.getElementById('lightbox-media-slot');
      slot.innerHTML = '';
      modal.classList.remove('active');
    }

    document.getElementById('lightbox-close').addEventListener('click', closeLightbox);
    document.getElementById('lightbox-modal').addEventListener('click', (e) => {
      if (e.target.id === 'lightbox-modal') closeLightbox();
    });
    document.getElementById('lightbox-prev').addEventListener('click', (e) => {
      e.stopPropagation();
      openLightbox((activeLightboxIndex - 1 + allGalleryFiles.length) % allGalleryFiles.length);
    });
    document.getElementById('lightbox-next').addEventListener('click', (e) => {
      e.stopPropagation();
      openLightbox((activeLightboxIndex + 1) % allGalleryFiles.length);
    });

    document.addEventListener('keydown', (e) => {
      if (!document.getElementById('lightbox-modal').classList.contains('active')) return;
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowLeft') document.getElementById('lightbox-prev').click();
      if (e.key === 'ArrowRight') document.getElementById('lightbox-next').click();
    });

    document.querySelectorAll('.filter-pill').forEach(btn => {
      btn.addEventListener('click', () => applyFilter(btn.getAttribute('data-filter')));
    });

    // Primary Loader
    async function loadGallery() {
      const galleryGrid = document.getElementById('gallery-grid');

      // 1. Direct tmpfiles.org ID list: ?g=id1,id2,id3...
      if (gParam) {
        const ids = gParam.split(',').map(s => s.trim()).filter(Boolean);
        if (ids.length) {
          const files = ids.map((id, i) => ({
            name: `Photo ${i + 1}`,
            type: 'image',
            url: `https://tmpfiles.org/dl/${id}`
          }));
          renderFiles(files, '');
          return;
        }
      }

      // 2. Direct JSON files parameter: ?files=...
      if (filesParam) {
        try {
          const parsed = JSON.parse(decodeURIComponent(filesParam));
          if (Array.isArray(parsed) && parsed.length > 0) {
            renderFiles(parsed, '');
            return;
          }
        } catch (e) {
          console.warn('Could not parse files parameter', e);
        }
      }

      // 3. Backend Gallery ID: ?id=... or /gallery/{id}
      if (!galleryId) {
        galleryGrid.innerHTML = '<div class="empty">No media files specified for this gallery.</div>';
        return;
      }

      try {
        const apiBase = (typeof window !== 'undefined' && window.MEDIA_API_BASE && window.MEDIA_API_BASE !== 'null')
          ? String(window.MEDIA_API_BASE).replace(/\/$/, '')
          : '';
        const response = await fetch(`${apiBase}/api/gallery/${encodeURIComponent(galleryId)}`);
        const data = await response.json();
        if (!response.ok || !data.files || !data.files.length) {
          galleryGrid.innerHTML = '<div class="empty">No media files found in this gallery yet.</div>';
          return;
        }

        renderFiles(data.files, apiBase);
      } catch (error) {
        galleryGrid.innerHTML = '<div class="empty">No media files available in this gallery.</div>';
      }
    }

    loadGallery();
  </script>
</body>
</html>
